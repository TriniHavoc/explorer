<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- socanet: WalletConnect project ID for the TTDx Wallet connector in the widget. -->
    <meta name="walletconnect-project-id" content="%VITE_WALLETCONNECT_PROJECT_ID%" />
    <title>socanet explorer</title>
    <meta
      name="description"
      content="Block explorer for socanet, the TTDx network. Based on Ping Dashboard (ping.pub)."
    />
    <link rel="stylesheet" type="text/css" href="/loader.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https: http: data: wss://relay.walletconnect.org wss://relay.walletconnect.com; frame-src 'self' https://verify.walletconnect.org https://verify.walletconnect.com; font-src 'self' data: https://fonts.gstatic.com;"
    />
  </head>
  <body>
    <div id="app">
      <div id="loading-bg">
        <div class="loading-logo">
          <img src="/logo.svg" alt="Logo" />
        </div>
        <div class="pre-loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- socanet: the widget is built from TriniHavoc/widget (socanet branch) and served locally;
         Ping.pub's analytics and ad scripts are removed. -->
    <script type="module" src="/ping-widget/widget.js"></script>
  </body>
</html>
